name: ringgas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_joystick: ^0.2.2
  wifi_iot: ^0.3.19+2
  permission_handler: ^11.0.1
  web_socket_channel: ^2.4.0
  flutter_mjpeg: ^2.0.4
  http: 0.13.6
  flutter_native_splash: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#ffffff"        # Background color
  image: assets/logo.png  # Your splash image
  android: true
  ios: true